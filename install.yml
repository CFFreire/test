#cloud-config

autoinstall:
  version: 1

  # ==========================================================
  # SISTEMA
  # ==========================================================

  locale: es_EC.UTF-8

  keyboard:
    layout: latam

  timezone: America/Guayaquil

  identity:
    hostname: develop
    username: carlos

    # Generar en Mac con:
    # openssl passwd -6
    password: "$6$REEMPLAZAR_CON_HASH"

  # ==========================================================
  # SSH
  # ==========================================================

  ssh:
    install-server: true
    allow-pw: true

    # OPCIONAL:
    # pega aquí la clave pública de tu Mac.
    #
    # En Mac:
    # cat ~/.ssh/id_ed25519.pub
    #
    # authorized-keys:
    #   - "ssh-ed25519 AAAA.... carlos@mac"

  # ==========================================================
  # DISCO
  # ==========================================================

  storage:
    layout:
      name: direct

  # ==========================================================
  # PAQUETES BASE
  # ==========================================================

  packages:
    - openssh-server
    - git
    - curl
    - wget
    - ca-certificates
    - gnupg
    - unzip
    - zip
    - jq
    - tree
    - htop
    - ripgrep
    - fzf
    - tmux
    - build-essential
    - software-properties-common
    - apt-transport-https

    # Python
    - python3
    - python3-pip
    - python3-venv
    - pipx

    # Java
    - default-jdk
    - maven
    - gradle

  updates: security

  # ==========================================================
  # CONFIGURACIÓN FINAL
  # ==========================================================

  late-commands:

    # --------------------------------------------------------
    # SSH
    # --------------------------------------------------------

    - curtin in-target --target=/target -- systemctl enable ssh

    # --------------------------------------------------------
    # Directorio de proyectos
    # --------------------------------------------------------

    - curtin in-target --target=/target -- mkdir -p /home/carlos/Projects

    - curtin in-target --target=/target -- chown -R carlos:carlos /home/carlos/Projects

    # ========================================================
    # Crear script de instalación dentro del sistema
    # ========================================================

    - |
      cat > /target/tmp/dev-setup.sh <<'DEVSETUP'
      #!/usr/bin/env bash

      set -e

      USER_NAME="carlos"
      USER_HOME="/home/$USER_NAME"

      echo
      echo "=============================================="
      echo " DEV ENVIRONMENT SETUP"
      echo "=============================================="
      echo

      # ======================================================
      # GitHub CLI
      # ======================================================

      echo ">>> GitHub CLI"

      mkdir -p -m 755 /etc/apt/keyrings

      curl -fsSL \
        https://cli.github.com/packages/githubcli-archive-keyring.gpg \
        -o /etc/apt/keyrings/githubcli-archive-keyring.gpg

      chmod go+r \
        /etc/apt/keyrings/githubcli-archive-keyring.gpg

      echo \
      "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
        > /etc/apt/sources.list.d/github-cli.list

      apt-get update
      apt-get install -y gh

      # ======================================================
      # VS CODE
      # ======================================================

      echo ">>> Visual Studio Code"

      wget -qO- \
        https://packages.microsoft.com/keys/microsoft.asc |
        gpg --dearmor \
        > /usr/share/keyrings/packages.microsoft.gpg

      echo \
      "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
        > /etc/apt/sources.list.d/vscode.list

      apt-get update
      apt-get install -y code

      # ======================================================
      # DOCKER ENGINE
      # ======================================================

      echo ">>> Docker Engine"

      curl -fsSL https://get.docker.com |
        sh

      usermod -aG docker "$USER_NAME"

      systemctl enable docker

      # ======================================================
      # TERRAFORM
      # ======================================================

      echo ">>> Terraform"

      wget -O- \
        https://apt.releases.hashicorp.com/gpg |
        gpg --dearmor \
        > /usr/share/keyrings/hashicorp-archive-keyring.gpg

      CODENAME=$(
        . /etc/os-release
        echo "$VERSION_CODENAME"
      )

      echo \
      "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $CODENAME main" \
        > /etc/apt/sources.list.d/hashicorp.list

      apt-get update
      apt-get install -y terraform

      # ======================================================
      # KUBECTL
      # ======================================================

      echo ">>> kubectl"

      ARCH=$(dpkg --print-architecture)

      case "$ARCH" in
        arm64)
          KUBE_ARCH="arm64"
          ;;
        amd64)
          KUBE_ARCH="amd64"
          ;;
      esac

      KUBE_VERSION=$(
        curl -L -s \
        https://dl.k8s.io/release/stable.txt
      )

      curl -LO \
        "https://dl.k8s.io/release/${KUBE_VERSION}/bin/linux/${KUBE_ARCH}/kubectl"

      install \
        -o root \
        -g root \
        -m 0755 \
        kubectl \
        /usr/local/bin/kubectl

      rm kubectl

      # ======================================================
      # AWS CLI
      # ======================================================

      echo ">>> AWS CLI"

      ARCH=$(uname -m)

      case "$ARCH" in

        aarch64|arm64)
          AWS_ARCH="aarch64"
          ;;

        x86_64)
          AWS_ARCH="x86_64"
          ;;

      esac

      mkdir -p /tmp/aws-install

      curl \
        "https://awscli.amazonaws.com/awscli-exe-linux-${AWS_ARCH}.zip" \
        -o /tmp/aws-install/aws.zip

      unzip -q \
        /tmp/aws-install/aws.zip \
        -d /tmp/aws-install

      /tmp/aws-install/aws/install

      rm -rf /tmp/aws-install

      # ======================================================
      # NODE + NVM
      # ======================================================

      echo ">>> Node.js / npm / pnpm"

      sudo -u "$USER_NAME" \
        bash <<'NODESETUP'

      export HOME=/home/carlos

      curl -o- \
        https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh |
        bash

      export NVM_DIR="$HOME/.nvm"

      [ -s "$NVM_DIR/nvm.sh" ] &&
        . "$NVM_DIR/nvm.sh"

      nvm install --lts

      nvm alias default 'lts/*'

      nvm use default

      npm install -g pnpm

      NODESETUP

      # ======================================================
      # CLAUDE CODE + CODEX
      # ======================================================

      echo ">>> AI development tools"

      sudo -u "$USER_NAME" \
        bash <<'AISETUP'

      export HOME=/home/carlos

      export NVM_DIR="$HOME/.nvm"

      [ -s "$NVM_DIR/nvm.sh" ] &&
        . "$NVM_DIR/nvm.sh"

      npm install -g \
        @anthropic-ai/claude-code

      npm install -g \
        @openai/codex

      AISETUP

      # ======================================================
      # VS CODE EXTENSIONS
      # ======================================================

      echo ">>> VS Code extensions"

      sudo -u "$USER_NAME" \
        bash <<'VSCODE'

      code --install-extension \
        dbaeumer.vscode-eslint || true

      code --install-extension \
        esbenp.prettier-vscode || true

      code --install-extension \
        ms-python.python || true

      code --install-extension \
        ms-azuretools.vscode-docker || true

      code --install-extension \
        eamodio.gitlens || true

      code --install-extension \
        redhat.vscode-yaml || true

      code --install-extension \
        hashicorp.terraform || true

      code --install-extension \
        ms-vscode-remote.remote-containers || true

      code --install-extension \
        ms-vscode-remote.remote-ssh || true

      VSCODE

      # ======================================================
      # PROJECT DIRECTORIES
      # ======================================================

      mkdir -p \
        "$USER_HOME/Projects/personal" \
        "$USER_HOME/Projects/work"

      chown -R \
        "$USER_NAME:$USER_NAME" \
        "$USER_HOME/Projects"

      # ======================================================
      # SSH DIRECTORY
      # ======================================================

      mkdir -p "$USER_HOME/.ssh"

      chmod 700 "$USER_HOME/.ssh"

      chown -R \
        "$USER_NAME:$USER_NAME" \
        "$USER_HOME/.ssh"

      # ======================================================
      # GIT GLOBAL
      # ======================================================

      sudo -u "$USER_NAME" \
        git config --global \
        init.defaultBranch main

      sudo -u "$USER_NAME" \
        git config --global \
        pull.rebase false

      sudo -u "$USER_NAME" \
        git config --global \
        core.autocrlf input

      # ======================================================
      # SHELL ALIASES
      # ======================================================

      cat >> "$USER_HOME/.bashrc" <<'ALIASES'

      # ======================================================
      # DEV ALIASES
      # ======================================================

      alias ll='ls -lah'

      alias gs='git status'
      alias ga='git add'
      alias gc='git commit'
      alias gp='git pull'
      alias gps='git push'

      alias d='docker'
      alias dc='docker compose'

      alias k='kubectl'

      ALIASES

      chown \
        "$USER_NAME:$USER_NAME" \
        "$USER_HOME/.bashrc"

      echo
      echo "=============================================="
      echo " DEVELOPMENT ENVIRONMENT READY"
      echo "=============================================="
      echo

      DEVSETUP

    # ========================================================
    # Ejecutar setup dentro del Ubuntu instalado
    # ========================================================

    - chmod +x /target/tmp/dev-setup.sh

    - curtin in-target --target=/target -- /tmp/dev-setup.sh

    # ========================================================
    # Limpiar
    # ========================================================

    - rm -f /target/tmp/dev-setup.sh